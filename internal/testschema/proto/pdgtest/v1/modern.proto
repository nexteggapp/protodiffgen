// Editions shapes: a closed enum and per-field features.
edition = "2023";

package pdgtest.v1;

// A closed enum declared with editions features.
enum Shade {
  option features.enum_type = CLOSED;
  // The first value, and so the default.
  SHADE_LIGHT = 1;
  // The second value.
  SHADE_DARK = 2;
}

// An editions message, reached from Root.
message Modern {
  // A string without a UTF-8 check.
  string code = 1 [features.utf8_validation = NONE];
  // A closed enum with explicit presence.
  Shade shade = 2;
  // A scalar with implicit presence.
  int32 plain = 3 [features.field_presence = IMPLICIT];
  // A repeated scalar with expanded encoding, replaced whole.
  repeated int64 stamps = 4 [features.repeated_field_encoding = EXPANDED];
}
